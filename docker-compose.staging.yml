services:
  api:
    ports: !reset []

  frontend:
    ports: !reset []

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRACELAB_GATEWAY_HOST_PORT:-8080}:8080"
    volumes:
      - ./deploy/staging-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
